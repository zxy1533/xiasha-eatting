<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAFA" />
  <meta name="description" content="下沙高校圈「今天吃什么」：查店避雷 + 问答机器人帮你拍板，只看同学原话，不给星级。" />
  <title>今天吃什么</title>
  <style>
/* ============================================================
   下沙「今天吃什么」网页版
   全部数值取自 design-tokens.json（rpx ÷ 2 = px）。
   学生避雷小抄：朱红 #C8371B 唯一强调色，奶白底 #FAFAFA，无星级无社区。
   ============================================================ */

:root {
  /* color */
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --raised: #F5F5F5;
  --border: #E4E3E2;
  --ink: #1D1C1B;
  --muted: #6E6B68;
  --accent: #C8371B;
  --accent-pressed: #A82E17;
  --on-accent: #FFFFFF;
  --success: #2F7A4F;
  --warning: #9A6A0B;
  --danger: #B32E28;
  --info: #4A6270;
  --tint-good: rgba(47, 122, 79, 0.10);
  --tint-warn: rgba(154, 106, 11, 0.10);
  --tint-bad: rgba(179, 46, 40, 0.10);
  --tint-info: rgba(74, 98, 112, 0.10);
  --tint-accent: rgba(200, 55, 27, 0.10);
  --accent-on-dark: #FBE3DC;

  /* spacing（7 档） */
  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 12px;
  --sp-lg: 16px;
  --sp-xl: 24px;
  --sp-2xl: 32px;
  --sp-3xl: 48px;

  /* typography（八档，单屏 ≤5 档） */
  --fs-t1: 11px;
  --fs-t2: 12px;
  --fs-t3: 13px;
  --fs-t4: 14px;
  --fs-t5: 16px;
  --fs-t6: 18px;
  --fs-t7: 24px;
  --fs-t8: 30px;

  /* radius（按角色取） */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-sheet: 16px;

  /* 其它 */
  --gutter: 16px;
  --tap-min: 44px;
  --icon-xs: 12px;
  --icon-sm: 16px;
  --icon-md: 20px;
  --icon-lg: 24px;
  --hairline: 1px;

  --elev-toast: 0 8px 32px rgba(29, 28, 27, 0.14);
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --dur-instant: 80ms;
  --dur-confirm: 150ms;
  --dur-enter: 240ms;
  --dur-strike: 300ms;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: var(--fs-t5);
  line-height: 1.7;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
}

button {
  padding: 0;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:disabled { cursor: default; }
input {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  outline: none;
}

a { color: inherit; text-decoration: none; }

/* ---------- 顶部栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 200;
  display: flex;
  height: 44px;
  align-items: center;
  gap: var(--sp-xs);
  padding: 0 var(--gutter);
  background: var(--surface);
  border-bottom: var(--hairline) solid var(--border);
}
.topbar-back {
  display: inline-flex;
  width: var(--tap-min);
  height: var(--tap-min);
  align-items: center;
  justify-content: flex-start;
  margin-left: calc(var(--gutter) * -1);
  color: var(--ink);
}
.topbar-title {
  color: var(--ink);
  font-size: var(--fs-t6);
  font-weight: 500;
  line-height: 1.4;
}

/* ---------- 内容与底部 tab ---------- */
.view {
  padding: var(--sp-lg) var(--gutter) calc(var(--sp-2xl) + 68px);
  min-height: 100vh;
}

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 300;
  display: flex;
  height: 56px;
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface);
  border-top: var(--hairline) solid var(--border);
}
.tabbar[hidden] { display: none; }
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--muted);
  font-size: var(--fs-t1);
  line-height: 1;
}
.tab .ic { width: 22px; height: 22px; }
.tab--active { color: var(--accent); }

/* ---------- 通用组件 ---------- */
.u-card {
  background: var(--surface);
  border: var(--hairline) solid var(--border);
  border-radius: var(--r-lg);
}

.u-btn-primary {
  display: flex;
  min-height: var(--tap-min);
  align-items: center;
  justify-content: center;
  gap: var(--sp-sm);
  padding: 0 var(--sp-lg);
  border-radius: var(--r-md);
  background: var(--accent);
  color: var(--on-accent);
  font-size: var(--fs-t6);
  font-weight: 500;
  line-height: 1.4;
  transition: background-color var(--dur-instant) ease-out, transform var(--dur-instant) ease-out;
}
.u-btn-primary:active { background: var(--accent-pressed); transform: scale(0.98); }
.u-btn-primary:disabled {
  background: var(--raised);
  color: var(--muted);
  border: var(--hairline) solid var(--border);
}

.u-btn-secondary {
  display: flex;
  min-height: var(--tap-min);
  align-items: center;
  justify-content: center;
  gap: var(--sp-xs);
  padding: 0 var(--sp-md);
  border: var(--hairline) solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-t5);
  transition: background-color var(--dur-instant) ease-out;
}
.u-btn-secondary:active { background: var(--raised); }
.u-btn-secondary:disabled { color: var(--muted); background: var(--raised); }

.u-chip {
  display: inline-flex;
  min-height: var(--tap-min);
  align-items: center;
  padding: 0 var(--sp-md);
  border-radius: var(--r-sm);
  background: var(--raised);
  color: var(--ink);
  font-size: var(--fs-t5);
  transition: background-color var(--dur-instant) ease-out;
}
.u-chip:active { background: var(--border); }

.u-hint { color: var(--muted); font-size: var(--fs-t3); line-height: 1.6; }
.u-caption { color: var(--muted); font-size: var(--fs-t2); line-height: 1.5; }
.u-num { font-variant-numeric: tabular-nums; }

.ic { display: inline-block; flex-shrink: 0; }

/* ---------- 打字机 ---------- */
.as { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
.as-char { opacity: 0; animation: char-in 80ms linear forwards; }
@keyframes char-in { to { opacity: 1; } }

/* ---------- verdict 徽章 ---------- */
.vb {
  display: inline-flex;
  min-height: var(--sp-xl);
  align-items: center;
  gap: var(--sp-xs);
  padding: 0 var(--sp-xs);
  border-radius: var(--r-sm);
  font-size: var(--fs-t2);
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}
.vb-lg { font-size: var(--fs-t3); }
.vb .ic { width: var(--icon-xs); height: var(--icon-xs); }
.vb-good { background: var(--tint-good); color: var(--success); }
.vb-bad  { background: var(--tint-bad);  color: var(--danger); }
.vb-warn { background: var(--tint-warn); color: var(--warning); }

/* ---------- 原话卡 ---------- */
.ec {
  position: relative;
  padding: var(--sp-md) var(--sp-md) var(--sp-sm) var(--sp-xl);
  background: var(--raised);
  border-radius: var(--r-lg);
}
.ec-quote {
  position: absolute;
  left: var(--sp-sm);
  top: var(--sp-md);
  width: var(--icon-xs);
  height: var(--icon-xs);
  color: var(--muted);
}
.ec-text {
  display: block;
  color: var(--ink);
  font-size: var(--fs-t4);
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.ec-clamp {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
.ec-more {
  display: inline-block;
  min-height: var(--sp-xl);
  padding: var(--sp-xs) 0 0;
  color: var(--accent);
  font-size: var(--fs-t3);
}

/* ---------- usage-tip ---------- */
.ut {
  display: flex;
  min-height: var(--sp-2xl);
  align-items: center;
  gap: var(--sp-xs);
  padding: var(--sp-xs) 0;
}
.ut-icon { width: var(--icon-sm); height: var(--icon-sm); flex-shrink: 0; }
.ut-text { flex: 1; font-size: var(--fs-t3); line-height: 1.6; }
.ut-action {
  display: inline-flex;
  min-height: var(--tap-min);
  align-items: center;
  padding: 0 var(--sp-sm);
  color: var(--accent);
  font-size: var(--fs-t3);
}
.ut-info .ut-text { color: var(--info); }
.ut-warning .ut-text { color: var(--warning); }
.ut-danger .ut-text { color: var(--danger); }

/* ---------- Toast（app 级覆盖层） ---------- */
.toast {
  position: fixed;
  left: var(--gutter);
  right: var(--gutter);
  bottom: calc(var(--sp-xl) + env(safe-area-inset-bottom));
  z-index: 500;
  display: flex;
  min-height: var(--tap-min);
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--r-md);
  background: var(--ink);
  box-shadow: var(--elev-toast);
  opacity: 0;
  transform: translateY(var(--sp-sm));
  pointer-events: none;
  transition: opacity var(--dur-enter) ease-out, transform var(--dur-enter) ease-out;
}
.toast--show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.toast__text { flex: 1; color: var(--surface); font-size: var(--fs-t4); line-height: 1.5; }
.toast__action {
  display: inline-flex;
  min-height: var(--tap-min);
  align-items: center;
  color: var(--accent-on-dark);
  font-size: var(--fs-t4);
  font-weight: 500;
}
.toast__close {
  display: inline-flex;
  width: var(--tap-min);
  height: var(--tap-min);
  align-items: center;
  justify-content: center;
  color: var(--muted);
}
.toast__close .ic { width: var(--icon-sm); height: var(--icon-sm); }

/* ============================================================
   首页「吃什么」
   ============================================================ */
.idx-lead { display: block; color: var(--ink); font-size: var(--fs-t6); font-weight: 500; line-height: 1.4; }

.idx-input-wrap { margin-top: var(--sp-sm); }
.idx-input {
  width: 100%;
  min-height: var(--tap-min);
  padding: 0 var(--sp-md);
  border: var(--hairline) solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-t5);
  line-height: 1.7;
}
.idx-input:focus { border-color: var(--accent); }
.idx-input::placeholder { color: var(--muted); }

.idx-submit { width: 100%; margin-top: var(--sp-md); }
.idx-bowl { width: var(--icon-md); height: var(--icon-md); }

.idx-chips { display: flex; flex-wrap: wrap; gap: var(--sp-sm); margin-top: var(--sp-lg); }
.idx-help { display: block; margin-top: var(--sp-sm); }

.idx-ghosts { margin-top: var(--sp-lg); }
.ghost {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  min-height: var(--sp-2xl);
}
.ghost-name { color: var(--muted); font-size: var(--fs-t4); }
.ghost-line {
  position: absolute;
  left: 0;
  top: 50%;
  width: 100%;
  height: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left center;
}
.ghost-fresh .ghost-line { animation: strike-draw var(--dur-strike) var(--ease-standard) forwards; }
.ghost:not(.ghost-fresh) .ghost-line { transform: scaleX(1); }
.ghost-note { margin-left: auto; color: var(--danger); font-size: var(--fs-t2); }
@keyframes strike-draw {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

.idx-loading { margin-top: var(--sp-xl); }

.idx-answer {
  margin-top: var(--sp-xl);
  padding: var(--sp-lg);
  transition: opacity var(--dur-enter) ease-out, transform var(--dur-enter) ease-out;
}
.idx-fade { opacity: 0; transform: translateY(var(--sp-xs)); }

.idx-summary { display: block; color: var(--ink); font-size: var(--fs-t5); line-height: 1.6; }

.idx-shop { margin-top: var(--sp-lg); padding-top: var(--sp-lg); border-top: var(--hairline) solid var(--border); }
.idx-shop-first { margin-top: var(--sp-md); padding-top: 0; border-top: 0; }

.idx-title-row { display: flex; align-items: center; gap: var(--sp-sm); }
.idx-circle { width: var(--icon-lg); height: var(--icon-lg); flex-shrink: 0; color: var(--accent); }
.idx-display { color: var(--ink); font-size: var(--fs-t7); font-weight: 500; line-height: 1.3; }
.idx-reason { display: block; margin-top: var(--sp-md); color: var(--ink); font-size: var(--fs-t4); line-height: 1.6; }
.idx-badge-row { margin-top: var(--sp-md); }
.idx-evidence { margin-top: var(--sp-sm); }
.idx-eq + .idx-eq { margin-top: var(--sp-sm); }
.idx-why-btn { width: 100%; margin-top: var(--sp-md); }

.idx-actions { display: flex; gap: var(--sp-sm); margin-top: var(--sp-lg); }
.idx-actions .u-btn-secondary { flex: 1; }
.idx-refresh { width: var(--icon-sm); height: var(--icon-sm); }
.idx-answer .u-caption { display: block; margin-top: var(--sp-sm); color: var(--muted); font-size: var(--fs-t3); text-align: right; }

/* ============================================================
   避雷查询
   ============================================================ */
.av-search {
  display: flex;
  min-height: var(--tap-min);
  align-items: center;
  gap: var(--sp-xs);
  padding: 0 var(--sp-sm);
  border: var(--hairline) solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
}
.av-search-icon { width: var(--icon-sm); height: var(--icon-sm); color: var(--muted); flex-shrink: 0; }
.av-input { flex: 1; min-height: var(--tap-min); color: var(--ink); font-size: var(--fs-t5); }
.av-input::placeholder { color: var(--muted); }
.av-go {
  display: inline-flex;
  min-width: var(--tap-min);
  min-height: var(--tap-min);
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-size: var(--fs-t5);
  font-weight: 500;
}

.av-chips-title { margin-top: var(--sp-lg); }
.av-chips { display: flex; flex-wrap: wrap; gap: var(--sp-sm); margin-top: var(--sp-sm); }
.av-honest { display: block; margin-top: var(--sp-md); }

.av-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: var(--sp-2xl);
  text-align: center;
}
.av-empty-title { color: var(--ink); font-size: var(--fs-t7); font-weight: 500; line-height: 1.3; }
.av-empty-btn { margin-top: var(--sp-lg); }

.av-results { margin-top: var(--sp-md); }
.av-match { margin-top: var(--sp-md); padding: var(--sp-lg); }
.av-match-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); }
.av-name { color: var(--ink); font-size: var(--fs-t7); font-weight: 500; line-height: 1.3; }
.av-source { display: block; margin-top: var(--sp-xs); }
.av-evidence { margin-top: var(--sp-md); }
.av-eq + .av-eq { margin-top: var(--sp-sm); }
.av-match-actions { display: flex; gap: var(--sp-sm); margin-top: var(--sp-lg); }
.av-match-actions .u-btn-secondary { flex: 1; }
.av-icon { width: var(--icon-sm); height: var(--icon-sm); }

/* ============================================================
   我的清单
   ============================================================ */
.mine-head { display: flex; align-items: center; gap: var(--sp-sm); }
.mine-title { color: var(--ink); font-size: var(--fs-t7); font-weight: 500; line-height: 1.3; }
.mine-count {
  display: inline-flex;
  min-width: var(--sp-xl);
  min-height: var(--sp-xl);
  align-items: center;
  justify-content: center;
  padding: 0 var(--sp-xs);
  border-radius: var(--r-sm);
  background: var(--raised);
  color: var(--muted);
  font-size: var(--fs-t3);
}

.mine-empty { display: flex; flex-direction: column; align-items: flex-start; margin-top: var(--sp-2xl); }
.mine-empty-btn { margin-top: var(--sp-lg); }

.mine-list { margin-top: var(--sp-lg); }
.mine-row {
  display: flex;
  min-height: var(--tap-min);
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) 0;
  border-bottom: var(--hairline) solid var(--border);
}
.mine-name { flex: 1; color: var(--ink); font-size: var(--fs-t7); font-weight: 500; line-height: 1.3; }
.mine-del {
  display: inline-flex;
  width: var(--tap-min);
  height: var(--tap-min);
  align-items: center;
  justify-content: center;
  color: var(--muted);
}
.mine-del .ic { width: var(--icon-md); height: var(--icon-md); }

/* ============================================================
   为什么推荐
   ============================================================ */
.why-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-sm); margin-top: var(--sp-md); }
.why-name { color: var(--ink); font-size: var(--fs-t7); font-weight: 500; line-height: 1.3; }
.why-subtitle { display: block; margin-top: var(--sp-xl); color: var(--ink); font-size: var(--fs-t5); font-weight: 500; }
.why-reason { display: block; margin-top: var(--sp-sm); color: var(--ink); font-size: var(--fs-t4); line-height: 1.6; }
.why-disputed {
  margin-top: var(--sp-md);
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--r-sm);
  background: var(--tint-warn);
  color: var(--warning);
  font-size: var(--fs-t4);
  line-height: 1.6;
}
.why-note { display: block; margin-top: var(--sp-lg); }
.why-evidence { margin-top: var(--sp-sm); }
.why-eq + .why-eq { margin-top: var(--sp-sm); }
.why-empty { display: flex; flex-direction: column; align-items: flex-start; margin-top: var(--sp-2xl); }
.why-empty-title { color: var(--ink); font-size: var(--fs-t5); line-height: 1.7; }
.why-empty-btn { margin-top: var(--sp-lg); }
.why-actions { display: flex; flex-direction: column; gap: var(--sp-sm); margin-top: var(--sp-xl); padding-bottom: env(safe-area-inset-bottom); }
.why-actions .u-btn-secondary { width: 100%; }

/* ---------- 动效降级 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>
  <header class="topbar">
    <button class="topbar-back" id="topbar-back" data-action="back" aria-label="返回" hidden>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg>
    </button>
    <span class="topbar-title" id="topbar-title"></span>
  </header>

  <main class="view" id="view"></main>

  <nav class="tabbar" id="tabbar" aria-label="底部导航">
    <button class="tab" data-action="nav" data-route="index" aria-label="吃什么">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7.5c0-1 1-1.4 1-2.5M12 7.5c0-1 1-1.4 1-2.5M16 7.5c0-1 1-1.4 1-2.5"/></svg>
      <span>吃什么</span>
    </button>
    <button class="tab" data-action="nav" data-route="avoid" aria-label="避雷">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <span>避雷</span>
    </button>
    <button class="tab" data-action="nav" data-route="mine" aria-label="清单">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4v-17Z"/></svg>
      <span>清单</span>
    </button>
  </nav>

  <script>

      html += '<button class="u-chip" data-action="index-example" data-text="' + ui.esc(t) + '" aria-label="填入 ' + ui.esc(t) + '">' + ui.esc(t) + '</button>';
    });
    html += '</div><span class="u-hint idx-help">不知道怎么说？点一句试试</span>';

    if (indexState.ghosts.length) {
      html += '<div class="idx-ghosts">';
      indexState.ghosts.forEach(function (g) {
        html += '<div class="ghost' + (g.fresh ? ' ghost-fresh' : '') + '">' +
          '<span class="ghost-name">' + ui.esc(g.name) + '</span>' +
          '<span class="ghost-line"></span>' +
          '<span class="ghost-note">划掉这家</span></div>';
      });
      html += '</div>';
    }

    if (indexState.busy) {
      html += '<div class="idx-loading"><span class="u-hint">在表里翻哪个能吃…</span></div>';
    }

    if (indexState.answer) html += answerCardHtml(indexState.answer, indexState.fading);

    return html;
  }

  function loadUsage() {
    EatWhat.api.usage().then(function (env) {
      if (env && env.code === 0 && env.data) {
        indexState.usage = env.data;
        indexState.scenario = '';
      } else {
        indexState.usage = null;
        indexState.scenario = ui.scenarioOf(env && env.code);
      }
      indexState.blocked = !!(indexState.usage && indexState.usage.global_stopped === true);
      var tipEl = document.getElementById('idx-usage');
      if (tipEl) tipEl.innerHTML = ui.usageTip(indexState.usage, indexState.scenario);
      var btn = document.querySelector('#view .idx-submit');
      if (btn) {
        var disabled = indexState.busy || indexState.blocked;
        btn.disabled = disabled;
        if (disabled) btn.classList.add('u-btn-disabled'); else btn.classList.remove('u-btn-disabled');
        var span = btn.querySelector('span');
        if (span) span.textContent = indexState.busy ? '翻小抄中…' : (indexState.blocked ? '今天的次数用完了' : '定一家');
      }
    });
  }

  function mountIndex() {
    if (!indexState.usageLoaded) {
      indexState.usageLoaded = true;
      loadUsage();
    }
    if (indexState.focusInput) {
      indexState.focusInput = false;
      var inp = document.getElementById('idx-question');
      if (inp) inp.focus();
    }
    if (store.consumeChangeOne()) {
      setTimeout(function () { changeOne(); }, 60);
    }
  }

  function indexAsk() {
    if (indexState.busy || indexState.blocked) return;
    runAsk();
  }

  function runAsk() {
    var question = String(indexState.question || '').trim();
    if (!question) {
      indexState.scenario = 'invalid';
      refresh();
      return;
    }
    indexState.busy = true;
    indexState.fading = false;
    indexState.scenario = '';
    indexState.answer = null;
    refresh();

    EatWhat.api.recommend(question, indexState.excludeIds.slice()).then(function (env) {
      if (!env || env.code !== 0 || !env.data || !env.data.answer) {
        indexState.busy = false;
        indexState.scenario = ui.scenarioOf(env && env.code);
        refresh();
        return;
      }
      var answer = env.data.answer;
      var ids = (answer.restaurants || []).map(function (r) { return r.restaurant_id; });
      indexState.excludeIds = indexState.excludeIds.concat(ids).slice(-20);
      indexState.answer = answer;
      indexState.busy = false;
      if (indexState.usage) {
        indexState.usage = Object.assign({}, indexState.usage, { daily_remaining: env.data.daily_remaining });
      }
      indexState.scenario = env.data.degraded ? 'invalid' : '';
      refresh();
    });
  }

  function changeOne() {
    var current = indexState.answer;
    if (indexState.busy) return;

    var ghosts = indexState.ghosts.slice();
    var names = (current && current.restaurants) ? current.restaurants.map(function (r) { return r.restaurant_name; }) : [];
    if (names.length) {
      ghosts = ghosts.map(function (g) { return Object.assign({}, g, { fresh: false }); });
      var seq = indexState.ghostSeq;
      names.forEach(function (name) {
        seq += 1;
        ghosts.push({ key: 'g' + seq, name: name, fresh: true });
      });
      while (ghosts.length > MAX_GHOSTS) ghosts.shift();
      indexState.ghosts = ghosts;
      indexState.ghostSeq = seq;
      indexState.fading = true;
      indexState.busy = true;
      refresh();
      setTimeout(function () {
        indexState.answer = null;
        indexState.fading = false;
        refresh();
      }, 200);
    } else {
      indexState.busy = true;
      refresh();
    }

    setTimeout(function () {
      var q = String(indexState.question || '').trim() || '随便来一家';
      indexState.question = q;
      runAsk();
    }, STRIKE_MS);
  }

  function indexGoWhy(el) {
    var answer = indexState.answer;
    if (!answer || !answer.restaurants) return;
    var idx = Number(el.getAttribute('data-index')) || 0;
    var single = answer.restaurants[idx] || answer.restaurants[0];
    if (!single) return;
    store.setAnswer(single);
    store.setReturnRoute('index');
    EatWhat.router.navigate('why');
  }

  /* ============================================================
     避雷查询
     ============================================================ */
  var AVOID_CHIPS = ['纸包鸡', '稻川岛滑蛋饭', '嗨将东北盒饭'];

  var avoidState = {
    query: '',
    result: null,
    searched: false,
    scenario: '',
    busy: false,
  };

  function renderAvoid() {
    var savedIds = store.readAll().map(function (it) { return it.id; });

    var html = '<div class="av-search">' + ui.icon('search', 'av-search-icon') +
      '<input class="av-input" id="av-query" type="text" value="' + ui.esc(avoidState.query) + '"' +
      ' placeholder="查一家店，看有没有人踩过雷" maxlength="40" data-input="avoid-query" data-enter="avoid-search" aria-label="查店名或商圈" />' +
      '<button class="av-go" data-action="avoid-search" ' + (avoidState.busy ? 'disabled' : '') + ' aria-label="查这家店">查</button></div>';

    html += '<div class="av-chips-title"><span class="u-caption">常被查的</span></div>';
    html += '<div class="av-chips">';
    AVOID_CHIPS.forEach(function (t) {
      html += '<button class="u-chip" data-action="avoid-chip" data-text="' + ui.esc(t) + '" aria-label="查询 ' + ui.esc(t) + '">' + ui.esc(t) + '</button>';
    });
    html += '</div><span class="u-hint av-honest">表里没有的店，我们不会瞎编</span>';

    if (avoidState.scenario) {
      html += '<div class="ut-wrap">' + ui.usageTip(null, avoidState.scenario) + '</div>';
    }

    if (avoidState.searched && avoidState.result && !avoidState.result.found) {
      html += '<div class="av-empty"><span class="av-empty-title">表里没有这家</span>' +
        '<span class="u-hint">换个写法试试，或者这家还没人踩过</span>' +
        '<button class="u-btn-secondary av-empty-btn" data-action="avoid-gotoindex" aria-label="让机器人帮我定">让机器人帮我定</button></div>';
    }

    if (avoidState.searched && avoidState.result && avoidState.result.found) {
      html += '<div class="av-results">';
      avoidState.result.matches.forEach(function (m) {
        var saved = savedIds.indexOf(m.id) >= 0;
        html += '<div class="u-card av-match">' +
          '<div class="av-match-head"><span class="av-name">' + ui.esc(m.name) + '</span>' + ui.verdictBadge(m.verdict) + '</div>' +
          '<span class="u-caption av-source">' + ui.esc(m.source_sheet) + ' · ' + m.mention_count + ' 条提及</span>' +
          '<div class="av-evidence">';
        m.evidence.forEach(function (ev) {
          html += '<div class="av-eq">' + ui.evidenceCard(ev) + '</div>';
        });
        html += '</div><div class="av-match-actions">' +
          '<button class="u-btn-secondary" data-action="avoid-save" data-id="' + ui.esc(m.id) + '" ' + (saved ? 'disabled' : '') + ' aria-label="存进清单">' +
          ui.icon('bookmark', 'av-icon') + '<span>' + (saved ? '已在清单' : '存进清单') + '</span></button>' +
          '<button class="u-btn-secondary" data-action="avoid-why" data-id="' + ui.esc(m.id) + '" aria-label="看原话">看原话</button>' +
          '</div></div>';
      });
      html += '</div>';
    }

    return html;
  }

  function avoidSearch() {
    var query = String(avoidState.query || '').trim();
    if (!query) {
      avoidState.scenario = 'invalid';
      refresh();
      return;
    }
    avoidState.busy = true;
    avoidState.scenario = '';
    refresh();

    EatWhat.api.avoid(query).then(function (env) {
      if (!env || env.code !== 0 || !env.data) {
        avoidState.busy = false;
        avoidState.searched = false;
        avoidState.scenario = ui.scenarioOf(env && env.code);
        refresh();
        return;
      }
      avoidState.busy = false;
      avoidState.searched = true;
      avoidState.scenario = '';
      avoidState.result = env.data;
      refresh();
    });
  }

  function avoidFind(id) {
    var matches = (avoidState.result && avoidState.result.matches) || [];
    for (var i = 0; i < matches.length; i += 1) { if (matches[i].id === id) return matches[i]; }
    return null;
  }

  function avoidSave(el) {
    var target = avoidFind(el.getAttribute('data-id'));
    if (!target) return;
    var result = store.add({ id: target.id, name: target.name, verdict: target.verdict });
    if (!result.ok && result.reason === 'exists') { toast.show({ text: '这家已经在清单里了' }); return; }
    if (!result.ok) { toast.show({ text: '没存上，再点一次' }); return; }
    refresh();
    toast.show({ text: '已存进清单' });
  }

  function avoidWhy(el) {
    var target = avoidFind(el.getAttribute('data-id'));
    if (!target) return;
    store.setAnswer({
      restaurant_id: target.id,
      restaurant_name: target.name,
      verdict: target.verdict,
      reason: target.evidence[0] || '表里没有更多原话了',
      evidence: target.evidence,
    });
    store.setReturnRoute('avoid');
    EatWhat.router.navigate('why');
  }

  /* ============================================================
     我的清单
     ============================================================ */
  function renderMine() {
    var items = store.readAll();
    var html = '<div class="mine-head"><span class="mine-title">我攒的店</span><span class="mine-count u-num">' + items.length + '</span></div>';
    html += '<span class="u-hint">只存在这台手机上，换个手机就没了</span>';

    if (items.length === 0) {
      html += '<div class="mine-empty"><span class="u-hint">还没攒店。查到能吃的，点书签存这儿。</span>' +
        '<button class="u-btn-secondary mine-empty-btn" data-action="mine-gotoavoid" aria-label="去查店">去查店</button></div>';
    } else {
      html += '<div class="mine-list">';
      items.forEach(function (it) {
        html += '<div class="mine-row">' +
          '<span class="mine-name">' + ui.esc(it.name) + '</span>' +
          ui.verdictBadge(it.verdict) +
          '<button class="mine-del" data-action="mine-remove" data-id="' + ui.esc(it.id) + '" aria-label="删除 ' + ui.esc(it.name) + '">' + ui.icon('close') + '</button></div>';
      });
      html += '</div>';
    }
    return html;
  }

  function mineRemove(el) {
    var id = el.getAttribute('data-id');
    var result = store.remove(id);
    if (!result.ok || !result.removed) { toast.show({ text: '没删掉，再点一次' }); return; }
    refresh();
    var removed = result.removed;
    var index = result.index;
    toast.show({
      text: '删了，可撤销',
      actionText: '撤销',
      duration: 5000,
      onAction: function () {
        store.restore(removed, index);
        refresh();
        toast.show({ text: '已经放回来了' });
      },
    });
  }

  /* ============================================================
     为什么推荐
     ============================================================ */
  function renderWhy() {
    var answer = store.getAnswer();
    if (!answer || !answer.restaurant_name) {
      return '<div class="why-empty"><span class="why-empty-title">这次没挑出理由，换个说法再问</span>' +
        '<button class="u-btn-secondary why-empty-btn" data-action="why-back" aria-label="返回">返回</button></div>';
    }
    var disputed = answer.verdict === '有争议';
    var saved = store.has(answer.restaurant_id);

    var html = '<div class="why-head"><span class="why-name">' + ui.esc(answer.restaurant_name) + '</span>' +
      ui.verdictBadge(answer.verdict, 'lg') + '</div>';
    html += '<span class="why-subtitle">凭什么推荐它</span>';
    html += '<span class="why-reason">' + ui.esc(answer.reason) + '</span>';
    if (disputed) html += '<div class="why-disputed">这家有争议，夸的和骂的都有，自己掂量</div>';
    html += '<span class="u-caption why-note">都是同学原话，名字抹掉了</span>';
    html += '<div class="why-evidence">';
    (answer.evidence || []).forEach(function (ev) {
      html += '<div class="why-eq">' + ui.evidenceCard(ev) + '</div>';
    });
    html += '</div>';
    html += '<div class="why-actions">' +
      '<button class="u-btn-primary" data-action="why-save" ' + (saved ? 'disabled' : '') + ' aria-label="就吃这家，存进清单">' + (saved ? '已在清单' : '就吃这家，存进清单') + '</button>' +
      '<button class="u-btn-secondary" data-action="why-changeone" aria-label="换一家">换一家</button>' +
      '</div>';
    return html;
  }

  function whySave() {
    var answer = store.getAnswer();
    if (!answer) return;
    var result = store.add({ id: answer.restaurant_id, name: answer.restaurant_name, verdict: answer.verdict });
    if (!result.ok && result.reason === 'exists') { toast.show({ text: '这家已经在清单里了' }); return; }
    if (!result.ok) { toast.show({ text: '没存上，再点一次' }); return; }
    refresh();
    toast.show({ text: '已存进清单' });
  }

  function whyChangeOne() {
    store.setPendingChangeOne();
    EatWhat.router.navigate(store.getReturnRoute());
  }

  /* ============================================================
     全局动作
     ============================================================ */
  function toggleEvidence(el) {
    var ec = el.closest('.ec');
    if (!ec) return;
    var text = ec.querySelector('.ec-text');
    var more = ec.querySelector('.ec-more');
    if (!text) return;
    var wasClamped = text.classList.contains('ec-clamp');
    text.classList.toggle('ec-clamp');
    if (more) more.textContent = wasClamped ? '收起' : '展开';
  }

  function handleTipAction(kind) {
    if (kind === 'gotoavoid') { EatWhat.router.navigate('avoid'); return; }
    if (kind === 'retry') {
      if (EatWhat.router.current === 'avoid') { avoidSearch(); }
      else { loadUsage(); runAsk(); }
    }
  }

  EatWhat.views = {
    index: { title: '吃什么', back: false, tab: true, render: renderIndex, mount: mountIndex },
    avoid: { title: '避雷', back: false, tab: true, render: renderAvoid },
    mine:  { title: '清单', back: false, tab: true, render: renderMine },
    why:   { title: '为什么推荐它', back: true, tab: false, render: renderWhy },
  };

  EatWhat.handleAction = function (action, el) {
    switch (action) {
      case 'nav': EatWhat.router.navigate(el.getAttribute('data-route')); break;
      case 'back': EatWhat.router.navigate(store.getReturnRoute()); break;
      case 'toggle-evidence': toggleEvidence(el); break;
      case 'toast-action': toast.runAction(); break;
      case 'toast-close': toast.hide(); break;
      case 'tip-action': handleTipAction(el.getAttribute('data-kind')); break;
      case 'index-ask': indexAsk(); break;
      case 'index-example':
        indexState.question = el.getAttribute('data-text') || '';
        indexState.focusInput = true;
        refresh();
        break;
      case 'index-changeone': changeOne(); break;
      case 'index-why': indexGoWhy(el); break;
      case 'avoid-search': avoidSearch(); break;
      case 'avoid-chip':
        avoidState.query = el.getAttribute('data-text') || '';
        avoidSearch();
        break;
      case 'avoid-save': avoidSave(el); break;
      case 'avoid-why': avoidWhy(el); break;
      case 'avoid-gotoindex': EatWhat.router.navigate('index'); break;
      case 'mine-remove': mineRemove(el); break;
      case 'mine-gotoavoid': EatWhat.router.navigate('avoid'); break;
      case 'why-save': whySave(); break;
      case 'why-changeone': whyChangeOne(); break;
      case 'why-back': EatWhat.router.navigate(store.getReturnRoute()); break;
    }
  };

  EatWhat.handleInput = function (name, el) {
    if (name === 'index-question') indexState.question = el.value;
    else if (name === 'avoid-query') avoidState.query = el.value;
  };
})(window.EatWhat = window.EatWhat || {});

</script>
  <script>
/**
 * 路由 + 引导 + 全局事件委托。
 * hash 路由： #/ (index) / #/avoid / #/mine / #/why。
 */
(function (EatWhat) {
  var routes = {
    index: EatWhat.views.index,
    avoid: EatWhat.views.avoid,
    mine: EatWhat.views.mine,
    why: EatWhat.views.why,
  };

  function currentRoute() {
    var path = (window.location.hash || '#/').replace(/^#\/?/, '');
    if (!path) path = 'index';
    return routes[path] ? path : 'index';
  }

  function render() {
    var route = currentRoute();
    EatWhat.router.current = route;
    var view = routes[route];

    document.getElementById('topbar-title').textContent = view.title;
    document.getElementById('topbar-back').hidden = !view.back;

    var tabbar = document.getElementById('tabbar');
    tabbar.hidden = !view.tab;
    if (view.tab) {
      var tabs = tabbar.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i += 1) {
        tabs[i].classList.toggle('tab--active', tabs[i].getAttribute('data-route') === route);
      }
    }

    var content = document.getElementById('view');
    content.innerHTML = view.render();
    if (view.mount) view.mount(content);
    window.scrollTo(0, 0);
  }

  function navigate(route) {
    window.location.hash = '#/' + (route === 'index' ? '' : route);
  }

  EatWhat.router = { current: 'index', render: render, navigate: navigate };
  EatWhat.refresh = render;

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    EatWhat.handleAction(el.getAttribute('data-action'), el);
  });

  document.addEventListener('input', function (e) {
    var el = e.target.closest('[data-input]');
    if (!el) return;
    EatWhat.handleInput(el.getAttribute('data-input'), el);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var el = e.target.closest('[data-enter]');
    if (!el) return;
    e.preventDefault();
    EatWhat.handleAction(el.getAttribute('data-enter'), el);
  });

  window.addEventListener('hashchange', render);
  render();
})(window.EatWhat = window.EatWhat || {});

</script>
